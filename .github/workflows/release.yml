name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build zip \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev \
            g++-mingw-w64-x86-64-posix mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Fetch Windows SDL2 packages
        run: |
          mkdir -p deps/windows && cd deps/windows
          # Dev packages (headers + import libs for linking)
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-2.32.4/SDL2-devel-2.32.4-mingw.tar.gz"
          wget -q "https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-devel-2.8.8-mingw.tar.gz"
          wget -q "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-devel-2.24.0-mingw.tar.gz"
          wget -q "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-devel-2.8.1-mingw.tar.gz"
          # Runtime packages (include dependency DLLs: libpng, zlib, freetype, etc.)
          wget -q "https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-2.8.8-win32-x64.zip" || true
          wget -q "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0-win32-x64.zip" || true
          wget -q "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1-win32-x64.zip" || true
          for f in *.tar.gz; do tar xf "$f"; done
          for f in *.zip; do unzip -qo "$f" -d runtime_dlls 2>/dev/null || true; done

      - name: Build Linux
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel $(nproc)
          strip build-linux/reliquary

      - name: Package Linux
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="dist/reliquary-linux-x64-${TAG}"
          mkdir -p "$DIR/save"
          EXE=$(find build-linux -name "reliquary" -type f -executable | head -1)
          [ -z "$EXE" ] && { echo "ERROR: binary not found"; exit 1; }
          cp "$EXE" "$DIR/"
          if [ -d build-linux/assets ]; then cp -r build-linux/assets "$DIR/"; else cp -r assets "$DIR/"; fi
          cp -r data "$DIR/"
          printf '#!/bin/bash\ncd "$(dirname "$0")"\n./reliquary\n' > "$DIR/run.sh"
          chmod +x "$DIR/run.sh"
          cd dist && tar czf "reliquary-linux-x64-${TAG}.tar.gz" "reliquary-linux-x64-${TAG}/"

      - name: Build Windows
        run: |
          SDL2_DIR="$(pwd)/deps/windows"
          SDL2_PREFIX="${SDL2_DIR}/SDL2-2.32.4/x86_64-w64-mingw32"
          SDL2_IMAGE_PREFIX="${SDL2_DIR}/SDL2_image-2.8.8/x86_64-w64-mingw32"
          SDL2_TTF_PREFIX="${SDL2_DIR}/SDL2_ttf-2.24.0/x86_64-w64-mingw32"
          SDL2_MIXER_PREFIX="${SDL2_DIR}/SDL2_mixer-2.8.1/x86_64-w64-mingw32"
          ALL_INCLUDES="${SDL2_PREFIX}/include;${SDL2_PREFIX}/include/SDL2;${SDL2_IMAGE_PREFIX}/include;${SDL2_IMAGE_PREFIX}/include/SDL2;${SDL2_TTF_PREFIX}/include;${SDL2_TTF_PREFIX}/include/SDL2;${SDL2_MIXER_PREFIX}/include;${SDL2_MIXER_PREFIX}/include/SDL2"
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=tools/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL2_INCLUDE_DIRS="${ALL_INCLUDES}" \
            -DSDL2_LIBRARIES="-L${SDL2_PREFIX}/lib -lmingw32 -lSDL2main -lSDL2" \
            -DSDL2_IMAGE_INCLUDE_DIRS="" \
            -DSDL2_IMAGE_LIBRARIES="-L${SDL2_IMAGE_PREFIX}/lib -lSDL2_image" \
            -DSDL2_TTF_INCLUDE_DIRS="" \
            -DSDL2_TTF_LIBRARIES="-L${SDL2_TTF_PREFIX}/lib -lSDL2_ttf" \
            -DSDL2_MIXER_INCLUDE_DIRS="" \
            -DSDL2_MIXER_LIBRARIES="-L${SDL2_MIXER_PREFIX}/lib -lSDL2_mixer"
          cmake --build build-windows --parallel $(nproc)
          x86_64-w64-mingw32-strip build-windows/reliquary.exe

      - name: Package Windows
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="dist/reliquary-windows-x64-${TAG}"
          mkdir -p "$DIR/save"
          EXE=$(find build-windows -name "reliquary.exe" -type f | head -1)
          [ -z "$EXE" ] && { echo "ERROR: exe not found"; exit 1; }
          cp "$EXE" "$DIR/"
          if [ -d build-windows/assets ]; then cp -r build-windows/assets "$DIR/"; else cp -r assets "$DIR/"; fi
          cp -r data "$DIR/"
          SDL2_DIR="$(pwd)/deps/windows"
          # Copy DLLs from dev packages (main SDL2 DLLs)
          for prefix in SDL2-2.32.4 SDL2_image-2.8.8 SDL2_ttf-2.24.0 SDL2_mixer-2.8.1; do
            find "${SDL2_DIR}/${prefix}/x86_64-w64-mingw32/bin" -name "*.dll" -exec cp {} "$DIR/" \; 2>/dev/null || true
          done
          # Copy dependency DLLs from runtime packages (libpng, zlib, freetype, etc.)
          find "${SDL2_DIR}/runtime_dlls" -name "*.dll" -exec cp {} "$DIR/" \; 2>/dev/null || true
          # MinGW runtime DLLs — must match the posix/SEH toolchain
          MINGW_BIN="/usr/lib/gcc/x86_64-w64-mingw32/13-posix"
          if [ ! -d "$MINGW_BIN" ]; then
            MINGW_BIN=$(dirname $(x86_64-w64-mingw32-g++-posix -print-file-name=libgcc_s_seh-1.dll) 2>/dev/null || echo "")
          fi
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            # First try the posix toolchain directory
            if [ -n "$MINGW_BIN" ] && [ -f "$MINGW_BIN/$dll" ]; then
              cp "$MINGW_BIN/$dll" "$DIR/"
            else
              found=$(find /usr/lib/gcc/x86_64-w64-mingw32 -name "$dll" -path "*posix*" 2>/dev/null | head -1)
              [ -z "$found" ] && found=$(find /usr -name "$dll" 2>/dev/null | head -1)
              [ -n "$found" ] && cp "$found" "$DIR/"
            fi
          done
          # Verify DLL consistency
          echo "=== Bundled DLLs ==="
          ls -la "$DIR"/*.dll
          echo "=== libstdc++ deps ==="
          x86_64-w64-mingw32-objdump -p "$DIR/libstdc++-6.dll" 2>/dev/null | grep "DLL Name" || true
          cd dist && zip -rq "reliquary-windows-x64-${TAG}.zip" "reliquary-windows-x64-${TAG}/"

      - name: Upload Linux+Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja sdl2 sdl2_image sdl2_ttf sdl2_mixer

      - name: Build macOS (arm64)
        run: |
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --parallel $(sysctl -n hw.logicalcpu)

      - name: Package macOS
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="dist/reliquary-macos-${TAG}"
          mkdir -p "$DIR/save"
          cp build-macos/reliquary "$DIR/"
          if [ -d build-macos/assets ]; then cp -r build-macos/assets "$DIR/"; else cp -r assets "$DIR/"; fi
          cp -r data "$DIR/"
          printf '#!/bin/bash\ncd "$(dirname "$0")"\n./reliquary\n' > "$DIR/run.sh"
          chmod +x "$DIR/run.sh"
          cd dist && tar czf "reliquary-macos-${TAG}.tar.gz" "reliquary-macos-${TAG}/"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/*.tar.gz

  release:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Reliquary ${{ github.ref_name }}"
          body: |
            ## Reliquary ${{ github.ref_name }}

            Turn-based roguelike. PoE-style passive tree, 15 use-based skills, 13 gods, 50 spells, 21 classes, stealth system, traps, monster behaviors.

            | Platform | File | Notes |
            |---|---|---|
            | Windows (x64) | `reliquary-windows-x64-${{ github.ref_name }}.zip` | Extract and run `reliquary.exe` |
            | Linux (x64) | `reliquary-linux-x64-${{ github.ref_name }}.tar.gz` | Needs SDL2: `apt install libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0` |
            | macOS (arm64) | `reliquary-macos-${{ github.ref_name }}.tar.gz` | Apple Silicon. May need `xattr -cr reliquary` to bypass Gatekeeper. Intel Macs: use Rosetta 2. |
          files: |
            release-files/*.tar.gz
            release-files/*.zip
          draft: false
          prerelease: true

  # Steam upload handled locally via tools/steam-upload.sh
  # (config.vdf too large for GitHub secrets — local steamcmd works)
